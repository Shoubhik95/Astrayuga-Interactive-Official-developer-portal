<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1d060a" />
      <stop offset="60%" stop-color="#0a0305" />
      <stop offset="100%" stop-color="#020001" />
    </radialGradient>

    <!-- Gold Accent Gradients -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe29d" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8a6f27" />
    </linearGradient>

    <linearGradient id="crimson-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff2e4c" />
      <stop offset="100%" stop-color="#800016" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="crimson-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.8"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-main {
      font-family: 'Cinzel Decorative', 'Cinzel', 'Georgia', serif;
      font-size: 48px;
      font-weight: 700;
      fill: url(#gold-grad);
      letter-spacing: 8px;
      text-anchor: middle;
    }
    .title-sub {
      font-family: 'Cinzel', 'Georgia', serif;
      font-size: 18px;
      font-weight: 400;
      fill: #ffffff;
      letter-spacing: 12px;
      text-anchor: middle;
      opacity: 0.9;
    }
    .tagline {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #ff2e4c;
      letter-spacing: 6px;
      text-anchor: middle;
      opacity: 0.8;
    }
    .grid-lines {
      stroke: #301015;
      stroke-width: 0.5;
      opacity: 0.3;
    }
  </style>

  <!-- Background -->
  <rect width="800" height="320" fill="url(#bg-grad)" />

  <!-- Ambient Light Effects (Glowing Orbs) -->
  <circle cx="400" cy="160" r="180" fill="#800016" opacity="0.12" filter="url(#crimson-glow)" />
  <circle cx="400" cy="160" r="80" fill="#d4af37" opacity="0.05" filter="url(#gold-glow)" />

  <!-- Cyber/Sacred Geometry Background Lines -->
  <g class="grid-lines">
    <!-- Concentric Circles -->
    <circle cx="400" cy="160" r="140" fill="none" />
    <circle cx="400" cy="160" r="145" fill="none" stroke-dasharray="5 5" />
    <circle cx="400" cy="160" r="100" fill="none" />
    <circle cx="400" cy="160" r="60" fill="none" />

    <!-- Crosshair Lines -->
    <line x1="150" y1="160" x2="650" y2="160" />
    <line x1="400" y1="20" x2="400" y2="300" />

    <!-- Diagonal Details -->
    <line x1="220" y1="50" x2="580" y2="270" stroke-dasharray="2 4" />
    <line x1="220" y1="270" x2="580" y2="50" stroke-dasharray="2 4" />
  </g>

  <!-- Outer Frame Details -->
  <rect x="20" y="20" width="760" height="280" fill="none" stroke="#4a151d" stroke-width="1" opacity="0.4" />
  <rect x="25" y="25" width="750" height="270" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.25" />
  
  <!-- Frame Corner Ticks -->
  <path d="M 15 35 L 15 15 L 35 15" fill="none" stroke="url(#gold-grad)" stroke-width="2" />
  <path d="M 785 35 L 785 15 L 765 15" fill="none" stroke="url(#gold-grad)" stroke-width="2" />
  <path d="M 15 285 L 15 305 L 35 305" fill="none" stroke="url(#gold-grad)" stroke-width="2" />
  <path d="M 785 285 L 785 305 L 765 305" fill="none" stroke="url(#gold-grad)" stroke-width="2" />

  <!-- Central Star / Logo Graphic -->
  <g transform="translate(400, 160)" filter="url(#gold-glow)">
    <!-- 8-pointed star -->
    <path d="M 0,-40 L 8,-12 L 36,-8 L 12,8 L 20,36 L 0,16 L -20,36 L -12,8 L -36,-8 L -8,-12 Z" fill="url(#gold-grad)" opacity="0.85" />
    <!-- Inner emblem -->
    <circle cx="0" cy="0" r="6" fill="#000" />
    <circle cx="0" cy="0" r="3" fill="#ff2e4c" />
  </g>

  <!-- Glowing Portal Ring -->
  <circle cx="400" cy="160" r="48" fill="none" stroke="url(#crimson-grad)" stroke-width="2" filter="url(#crimson-glow)" opacity="0.8" />

  <!-- Typography -->
  <!-- Top decorative label -->
  <text x="400" y="80" class="tagline">OFFICIAL DEVELOPER PORTAL</text>

  <!-- Main Title -->
  <text x="400" y="145" class="title-main" filter="url(#gold-glow)">ASTRAYUGA</text>
  <text x="404" y="200" class="title-sub">STUDIOS</text>

  <!-- Bottom Tagline -->
  <text x="400" y="255" class="tagline" style="fill: #d4af37;">CRAFTING WORLDS • TELLING UNTOLD STORIES</text>

  <!-- Small tech accents -->
  <rect x="380" y="275" width="40" height="2" fill="#ff2e4c" opacity="0.6" />
  <circle cx="370" cy="276" r="1.5" fill="#d4af37" opacity="0.6" />
  <circle cx="430" cy="276" r="1.5" fill="#d4af37" opacity="0.6" />
</svg>
